<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PawJai Systems Check Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
        background: #f8fafc;
      }

      body {
        margin: 0;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid #e5e7eb;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(8px);
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        max-width: 1180px;
        margin: 0 auto;
        padding: 16px 20px;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
      }

      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #ffffff;
        color: #111827;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 20px;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }

      .tabs a {
        border: 1px solid #d1d5db;
        border-radius: 999px;
        background: #ffffff;
        color: #374151;
        font-size: 13px;
        font-weight: 600;
        padding: 7px 10px;
        text-decoration: none;
      }

      section {
        margin: 0 0 28px;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 16px;
        line-height: 1.3;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>PawJai Systems Check - 2026-07-01</h1>
        <a class="button" href="./pawjai_systems_check_2026-07-01.xlsx">Open Excel Workbook</a>
      </div>
    </header>
    <main>
      <nav class="tabs" aria-label="Workbook sheet previews">
        <a href="#admin-log">Admin Log</a>
        <a href="#issues">Issues</a>
        <a href="#journey-log">Journey Log</a>
        <a href="#summary">Summary</a>
        <a href="#test-data">Test Data</a>
      </nav>

      <section id="admin-log">
        <h2>Admin Log</h2>
        <img src="./admin_log_preview.png" alt="Admin Log sheet preview" />
      </section>

      <section id="issues">
        <h2>Issues</h2>
        <img src="./issues_preview.png" alt="Issues sheet preview" />
      </section>

      <section id="journey-log">
        <h2>Journey Log</h2>
        <img src="./journey_log_preview.png" alt="Journey Log sheet preview" />
      </section>

      <section id="summary">
        <h2>Summary</h2>
        <img src="./summary_preview.png" alt="Summary sheet preview" />
      </section>

      <section id="test-data">
        <h2>Test Data</h2>
        <img src="./test_data_preview.png" alt="Test Data sheet preview" />
      </section>
    </main>
  </body>
</html>
